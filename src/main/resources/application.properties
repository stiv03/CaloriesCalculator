spring.application.name=calories
spring.datasource.url=jdbc:postgresql://localhost:5432/first_test
spring.datasource.username=codeninjas
spring.datasource.password=121222tu
spring.jpa.hibernate.ddl-auto=update

# Don't keep a JPA session open during view rendering. Forces correct
# fetch strategies in services and shortens DB connection lifetime.
spring.jpa.open-in-view=false

# JWT
# Override in production via JWT_SECRET / JWT_EXPIRATION_MS env vars.
# Secret must be a base64-encoded value of >= 32 raw bytes (HS256).
jwt.secret=${JWT_SECRET:ZG8tbm90LXVzZS10aGlzLWluLXByb2QtcmVwbGFjZS13aXRoLWVudi1qd3Qtc2VjcmV0LWF0LWxlYXN0LTI1Ni1iaXRz}
jwt.expiration-ms=${JWT_EXPIRATION_MS:172800000}

# Google Health API (server-side OAuth for unattended sync).
# Set all in production via env vars. redirect-uri must EXACTLY match an
# Authorized redirect URI on the Google OAuth client.
google.health.client-id=${GOOGLE_HEALTH_CLIENT_ID:}
google.health.client-secret=${GOOGLE_HEALTH_CLIENT_SECRET:}
google.health.redirect-uri=${GOOGLE_HEALTH_REDIRECT_URI:http://localhost:8080/api/v1/health/oauth/callback}
# Where to send the browser after connecting (the app's Profile page).
google.health.post-connect-redirect=${GOOGLE_HEALTH_POST_CONNECT_REDIRECT:http://localhost:3000/user-profile}
# AES key (base64 of exactly 16/24/32 raw bytes) used to encrypt stored refresh tokens.
google.health.token-enc-key=${GOOGLE_HEALTH_TOKEN_ENC_KEY:CYv72PM9PeLJATnA3OdBjczWvdR0QgxYE9Ym5O3mBFA=}
